name: Build Soulu Preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after a successful build
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: [preview-37]
    paths:
      - "cef/**"
      - "installer/**"
      - "scripts/**"
      - "ui/**"
      - "vpn/**"
      - ".github/workflows/build-cef.yml"

permissions:
  contents: write
  actions: write

# Only fresh source builds can package or publish.
concurrency:
  group: soulu-cef-main
  cancel-in-progress: true

jobs:
  windows-cef:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PREVIEW_VERSION: 0.9.0-cef-preview.37
      PREVIEW_NUMBER: 37
      PYTHONUTF8: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout Soulu
        uses: actions/checkout@v4
        with:
          path: browser

      - name: Checkout official CEF project
        uses: actions/checkout@v4
        with:
          repository: chromiumembedded/cef-project
          ref: 3aec7049cf63a36876d7a6ef538842d6af314482
          path: cef-project

      - name: Pin the approved CEF distribution on a clean path
        shell: pwsh
        run: |
          if ((Test-Path cef-project/third_party/cef) -or (Test-Path cef-build)) {
            throw 'Clean build required: CEF distribution or build directory already exists'
          }
          $index = Invoke-RestMethod 'https://cef-builds.spotifycdn.com/index.json'
          $versions = @($index.windows64.versions | Where-Object {
            $_.cef_version -match '^154\.0\.32\+g[0-9a-f]+\+chromium-154\.0\.8037\.58$' -and
            $_.chromium_version -eq '154.0.8037.58'
          })
          if ($versions.Count -ne 1) { throw 'Exactly one approved CEF distribution must exist; no fallback allowed' }
          $version = $versions[0].cef_version
          $cmakeFile = 'cef-project/CMakeLists.txt'
          $cmake = Get-Content $cmakeFile -Raw
          $pattern = 'set\(CEF_VERSION "[^"]+"\)'
          if ([regex]::Matches($cmake, $pattern).Count -ne 1) { throw 'CEF project version declaration changed' }
          $cmake = [regex]::Replace($cmake, $pattern, ('set(CEF_VERSION "' + $version + '")'))
          # Soulu needs the wrapper and examples, not upstream CEF test applications.
          # The project snapshot's test targets are incompatible with this distribution.
          foreach ($target in @('cefclient', 'cefsimple', 'gtest', 'ceftests')) {
            $line = 'add_subdirectory(${CEF_ROOT}/tests/' + $target + ')'
            if (!$cmake.Contains($line)) { throw "Upstream target declaration changed: $target" }
            $cmake = $cmake.Replace($line, '')
          }
          Set-Content $cmakeFile $cmake -Encoding utf8
          Write-Host "Pinned CEF distribution: $version"

      - name: Add Soulu target and assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force browser/cef/soulu cef-project/examples/soulu
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/ui | Out-Null
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/vpn | Out-Null
          Copy-Item -Recurse -Force browser/ui/* cef-project/examples/soulu/assets/ui/
          Copy-Item -Recurse -Force browser/vpn/* cef-project/examples/soulu/assets/vpn/
          Add-Content cef-project/examples/CMakeLists.txt "`nadd_subdirectory(soulu)`n"

      - name: Use CEF-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CEF Python compatibility package
        shell: pwsh
        run: python -m pip install --disable-pip-version-check six

      - name: Configure CEF
        shell: pwsh
        run: |
          cmake -S cef-project -B cef-build -A x64 -DUSE_SANDBOX=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Soulu
        shell: pwsh
        run: |
          cmake --build cef-build --config Release --target soulu --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate output and package ZIP
        id: package
        shell: pwsh
        run: |
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $exe) { throw "Soulu.exe was not produced" }
          $buildDir = $exe.Directory.FullName
          & ./browser/scripts/verify-cef-engine.ps1 -BuildDir $buildDir -ReportPath (Join-Path $buildDir "engine-version.json")
          New-Item -ItemType Directory -Force browser/artifacts | Out-Null
          $zip = Join-Path $PWD "browser/artifacts/Soulu-Preview-$env:PREVIEW_NUMBER-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zip -Force
          Add-Type -AssemblyName System.Drawing
          $browserIcon=[System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          $browserIcon.ToBitmap().Save((Join-Path $PWD "browser/artifacts/browser-exe-icon.png"))
          "SOULU_SCREENSHOT:browser-exe-icon="+[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD "browser/artifacts/browser-exe-icon.png")))
          "build_dir=$buildDir" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $buildDir = "${{ steps.package.outputs.build_dir }}"
          $out = Join-Path $PWD "browser/artifacts/Soulu-Preview-$env:PREVIEW_NUMBER-x64.exe"
          & ./browser/installer/build.ps1 -BuildDir $buildDir -OutFile $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.Drawing
          $setupIcon=[System.Drawing.Icon]::ExtractAssociatedIcon($out)
          $setupIcon.ToBitmap().Save((Join-Path $PWD "browser/artifacts/installer-exe-icon.png"))
          "SOULU_SCREENSHOT:installer-exe-icon="+[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD "browser/artifacts/installer-exe-icon.png")))

      - name: Verify ZIP and installer payload before upload or release
        id: verified
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "browser/artifacts/Soulu-Preview-$env:PREVIEW_NUMBER-x64.zip"
          $checkDir = Join-Path $env:RUNNER_TEMP ("soulu-zip-" + $env:GITHUB_RUN_ID)
          Expand-Archive -LiteralPath $zip -DestinationPath $checkDir
          & ./browser/scripts/verify-cef-engine.ps1 -BuildDir $checkDir -ReportPath browser/artifacts/engine-version.json
          $payloadDir = Join-Path $env:RUNNER_TEMP ("soulu-payload-" + $env:GITHUB_RUN_ID)
          $payload = Join-Path $PWD "browser/installer/payload.exe"
          $install = Start-Process $payload -ArgumentList @("/S", "/D=$payloadDir") -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer payload extraction failed" }
          & ./browser/scripts/verify-cef-engine.ps1 -BuildDir $payloadDir
          $version = Get-Content browser/artifacts/engine-version.json -Raw | ConvertFrom-Json
          "Soulu Preview $env:PREVIEW_NUMBER. Verified CEF $($version.cef) / Chromium $($version.chromium). Source: $env:GITHUB_SHA. Clean build: $env:GITHUB_RUN_ID." | Set-Content browser/artifacts/release-notes.md -Encoding utf8
          "passed=true" >> $env:GITHUB_OUTPUT

      - name: Upload verified engine evidence
        if: success() && steps.verified.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-engine-verification-${{ github.run_id }}
          path: browser/artifacts/engine-version.json
          if-no-files-found: error

      - name: Test live CEF settings and toolbar on Windows
        # Cloud visual probes are diagnostic and must not block packaging.
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client pillow dxcam
          $personalize='HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item $personalize -Force | Out-Null
          Set-ItemProperty $personalize EnableTransparency 1 -Type DWord
          $env:SOULU_UI_TEST_PORT = "9223"
          $installedExe = Join-Path "${{ steps.package.outputs.build_dir }}" "Soulu.exe"
          $app = Start-Process $installedExe -PassThru
          try {
            python browser/scripts/test-cef-ui.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Test bookmarks persistence and native tab overview
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client
          $env:SOULU_UI_TEST_PORT = '9223'
          python browser/scripts/test-cef-bookmarks-overview.py '${{ steps.package.outputs.build_dir }}/Soulu.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test persistent CEF cookies and site storage
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-preview36-storage'
          $env:SOULU_UI_TEST_PORT = "9223"
          $installedExe = Join-Path "${{ steps.package.outputs.build_dir }}" "Soulu.exe"
          python browser/scripts/test-cef-storage.py $installedExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify internal tabs and native link context menu
        shell: pwsh
        run: |
          $env:SOULU_UI_TEST_PORT = '9223'
          $installedExe = Join-Path '${{ steps.package.outputs.build_dir }}' 'Soulu.exe'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-preview36-navigation'
          python browser/scripts/test-cef-navigation.py $installedExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-preview36-menu'
          python browser/scripts/test-cef-link-menu.py $installedExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify retained layout and native resize
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-preview36-layout'
          python browser/scripts/test-cef-layout.py '${{ steps.package.outputs.build_dir }}/Soulu.exe' browser/artifacts/layout-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test visible installer controls with mouse on Windows
        continue-on-error: ${{ contains(github.event.head_commit.message, '[publish-as-is]') }}
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MouseTest {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left, Top, Right, Bottom; }
            public delegate bool EnumProc(IntPtr hwnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X, Y; }
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT point);
            public static string Describe(IntPtr hwnd) {
              var cls = new System.Text.StringBuilder(128);
              var txt = new System.Text.StringBuilder(256);
              GetClassName(hwnd, cls, cls.Capacity);
              GetWindowText(hwnd, txt, txt.Capacity);
              return $"{cls}: {txt} hwnd={hwnd}";
            }
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll", EntryPoint="GetClassLongPtrW")] public static extern IntPtr GetClassLongPtr(IntPtr hWnd, int index);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, EnumProc callback, IntPtr data);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr hwnd, System.Text.StringBuilder text, int max);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr hwnd, System.Text.StringBuilder text, int max);
            public static IntPtr FindButton(IntPtr parent, string prefix) {
              IntPtr found = IntPtr.Zero;
              EnumChildWindows(parent, delegate(IntPtr hwnd, IntPtr data) {
                var cls = new System.Text.StringBuilder(128);
                var txt = new System.Text.StringBuilder(256);
                GetClassName(hwnd, cls, cls.Capacity);
                GetWindowText(hwnd, txt, txt.Capacity);
                if (cls.ToString().Equals("Button", StringComparison.OrdinalIgnoreCase) &&
                    txt.ToString().StartsWith(prefix, StringComparison.OrdinalIgnoreCase)) {
                  found = hwnd; return false;
                }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          '@

          Add-Type -AssemblyName System.Drawing
          function Save-Window($handle, [string]$name) {
            $bounds=New-Object MouseTest+RECT
            [MouseTest]::GetWindowRect($handle,[ref]$bounds) | Out-Null
            $bmp=New-Object System.Drawing.Bitmap ($bounds.Right-$bounds.Left),($bounds.Bottom-$bounds.Top)
            $graphics=[System.Drawing.Graphics]::FromImage($bmp)
            $graphics.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bmp.Size)
            $bmp.Save((Join-Path $PWD "browser/artifacts/$name.png"))
            $graphics.Dispose();$bmp.Dispose()
            "SOULU_SCREENSHOT:$name="+[Convert]::ToBase64String([IO.File]::ReadAllBytes((Join-Path $PWD "browser/artifacts/$name.png")))
          }
          function Click-At([int]$x, [int]$y) {
            [MouseTest]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 150
            [MouseTest]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Milliseconds 100
            [MouseTest]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          }

          $installer = Join-Path $PWD "browser/artifacts/Soulu-Preview-$env:PREVIEW_NUMBER-x64.exe"
          # Keep the installed-browser check independent of the diagnostic UI
          # probe's settings and force-closed profile.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'soulu-installer-smoke'
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/Soulu/Soulu.exe"
          if (Test-Path (Split-Path $installedExe)) { Remove-Item (Split-Path $installedExe) -Recurse -Force }

          $process = Start-Process $installer -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and $process.MainWindowHandle -eq 0) {
            Start-Sleep -Milliseconds 250
            $process.Refresh()
          }
          if ($process.MainWindowHandle -eq 0) { throw "Installer window did not open" }

          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          $beforeDrag = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle, [ref]$beforeDrag) | Out-Null
          [MouseTest]::SetCursorPos(($beforeDrag.Left + 130), ($beforeDrag.Top + 25)) | Out-Null
          Start-Sleep -Milliseconds 200
          [MouseTest]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          [MouseTest]::SetCursorPos(($beforeDrag.Left + 220), ($beforeDrag.Top + 80)) | Out-Null
          Start-Sleep -Milliseconds 350
          [MouseTest]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          $afterDrag = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle, [ref]$afterDrag) | Out-Null
          "Drag check: before=$($beforeDrag.Left),$($beforeDrag.Top) after=$($afterDrag.Left),$($afterDrag.Top)"
          if (($afterDrag.Left - $beforeDrag.Left) -lt 40) { throw "Installer window did not move by mouse drag" }
          Save-Window $process.MainWindowHandle "installer-welcome"
          $deadline = (Get-Date).AddSeconds(30)
          $installHwnd = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline -and $installHwnd -eq [IntPtr]::Zero) {
            Start-Sleep -Milliseconds 250
            $installHwnd = [MouseTest]::FindButton($process.MainWindowHandle, "Установить")
          }
          if ($installHwnd -eq [IntPtr]::Zero) { throw "Native Install button handle was not found" }
          $rect = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($installHwnd, [ref]$rect) | Out-Null
          $x = [int](($rect.Left + $rect.Right) / 2)
          $y = [int](($rect.Top + $rect.Bottom) / 2)
          $hit = [MouseTest]::WindowFromPoint([MouseTest+POINT]@{ X=$x; Y=$y })
          "Install control: $([MouseTest]::Describe($installHwnd)); mouse hit: $([MouseTest]::Describe($hit)) at $x,$y"
          if ($hit -ne $installHwnd) { throw "Visible Install button is occluded by another control" }
          Click-At $x $y
          Start-Sleep -Milliseconds 300
          Save-Window $process.MainWindowHandle "installer-installing"
          $during=New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle,[ref]$during) | Out-Null
          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          [MouseTest]::SetCursorPos(($during.Left+120),($during.Top+25)) | Out-Null
          Start-Sleep -Milliseconds 200
          [MouseTest]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
          Start-Sleep -Milliseconds 150
          [MouseTest]::SetCursorPos(($during.Left+170),($during.Top+50)) | Out-Null
          Start-Sleep -Milliseconds 250
          [MouseTest]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
          $moved=New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle,[ref]$moved) | Out-Null
          if(($moved.Left-$during.Left) -lt 30){throw 'Installer did not move during extraction'}

          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $installedExe)) {
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $installedExe)) { throw "Mouse click on Install did not start installation" }

          $process.Refresh()
          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          # File creation happens before the full 387 MB payload has finished
          # extracting. Wait for the actual finish-page control, not a timer.
          $deadline = (Get-Date).AddMinutes(5)
          $openHwnd = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline -and $openHwnd -eq [IntPtr]::Zero) {
            Start-Sleep -Milliseconds 250
            $openHwnd = [MouseTest]::FindButton($process.MainWindowHandle, "Готово")
          }
          if ($openHwnd -eq [IntPtr]::Zero) { throw "Native Open button handle was not found" }
          $desktopLink=Join-Path ([Environment]::GetFolderPath('Desktop')) 'Soulu.lnk'
          $startLink=Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Soulu/Soulu.lnk'
          $shortcutShell=New-Object -ComObject WScript.Shell
          foreach($link in @($desktopLink,$startLink)){
            if(-not (Test-Path $link)){throw "Soulu shortcut missing: $link"}
            $iconLocation=$shortcutShell.CreateShortcut($link).IconLocation
            "Shortcut icon: $link -> $iconLocation"
            if($iconLocation -notmatch 'soulu-icon-v24\.ico,0$'){throw "Shortcut still references stale icon: $iconLocation"}
          }
          $uninstaller=Join-Path (Split-Path $installedExe) 'Uninstall Soulu.exe'
          if(-not (Test-Path $uninstaller)){throw 'Uninstall Soulu.exe is missing'}
          $uninstallIcon=[System.Drawing.Icon]::ExtractAssociatedIcon($uninstaller)
          if(-not $uninstallIcon){throw 'Uninstall Soulu.exe has no associated icon'}
          $uninstallIcon.ToBitmap().Save((Join-Path $PWD 'browser/artifacts/uninstaller-exe-icon.png'))
          $appEntry=Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Soulu'
          if($appEntry.DisplayIcon -ne $installedExe){throw "Installed Apps icon target is wrong: $($appEntry.DisplayIcon)"}
          Start-Sleep -Seconds 4
          $process.Refresh()
          if ($process.HasExited) { throw "Installer closed without clicking Open" }
          Save-Window $process.MainWindowHandle "installer-finished"
          $stillOpen = [MouseTest]::FindButton($process.MainWindowHandle, "Готово")
          if ($stillOpen -eq [IntPtr]::Zero) { throw "Finish screen disappeared without user input" }
          [MouseTest]::GetWindowRect($openHwnd, [ref]$rect) | Out-Null
          $openX = [int](($rect.Left + $rect.Right) / 2)
          $openY = [int](($rect.Top + $rect.Bottom) / 2)
          $openHit = [MouseTest]::WindowFromPoint([MouseTest+POINT]@{ X=$openX; Y=$openY })
          "Open control: $([MouseTest]::Describe($openHwnd)); mouse hit: $([MouseTest]::Describe($openHit))"
          if ($openHit -ne $openHwnd) { throw "Visible Open button is occluded by another control" }
          Click-At $openX $openY

          $deadline = (Get-Date).AddSeconds(45)
          $soulu = $null
          while ((Get-Date) -lt $deadline -and -not $soulu) {
            Start-Sleep -Milliseconds 500
            # CEF also starts Soulu processes with no top-level window. Wait
            # for the browser host, rather than inspect the whole process array.
            $soulu = Get-Process Soulu -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } | Select-Object -First 1
          }
          if (-not $soulu) { throw "Mouse click on Open did not create a Soulu taskbar window" }
          $taskbarIcon=[MouseTest]::SendMessage($soulu.MainWindowHandle,0x007F,[IntPtr]2,[IntPtr]::Zero)
          if($taskbarIcon -eq [IntPtr]::Zero){$taskbarIcon=[MouseTest]::GetClassLongPtr($soulu.MainWindowHandle,-34)}
          if($taskbarIcon -eq [IntPtr]::Zero){$taskbarIcon=[MouseTest]::GetClassLongPtr($soulu.MainWindowHandle,-14)}
          if($taskbarIcon -eq [IntPtr]::Zero){throw 'Soulu taskbar window has no small icon'}
          [System.Drawing.Icon]::FromHandle($taskbarIcon).ToBitmap().Save((Join-Path $PWD 'browser/artifacts/taskbar-window-icon.png'))
          Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
          "Physical mouse-click, extraction drag and persistent finish checks passed."
          # Repeat with launch unchecked: Done must close without starting Soulu.
          $noLaunch = Start-Process $installer -PassThru
          Start-Sleep -Seconds 2
          $noLaunch.Refresh()
          $button=[MouseTest]::FindButton($noLaunch.MainWindowHandle,"Установить")
          [MouseTest]::GetWindowRect($button,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          $deadline=(Get-Date).AddMinutes(5)
          $done=[IntPtr]::Zero
          while((Get-Date) -lt $deadline -and $done -eq [IntPtr]::Zero){
            Start-Sleep -Milliseconds 300
            $done=[MouseTest]::FindButton($noLaunch.MainWindowHandle,"Готово")
          }
          if($done -eq [IntPtr]::Zero){throw 'Second install did not finish'}
          $toggle=[MouseTest]::FindButton($noLaunch.MainWindowHandle,"Запустить Soulu")
          if($toggle -eq [IntPtr]::Zero){throw 'Launch checkbox missing'}
          [MouseTest]::GetWindowRect($toggle,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          [MouseTest]::GetWindowRect($done,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          if(-not $noLaunch.WaitForExit(5000)){throw 'Done did not close installer'}
          Start-Sleep -Seconds 2
          if(Get-Process Soulu -ErrorAction SilentlyContinue){throw 'Soulu started with launch unchecked'}
          "Unchecked-launch scenario passed."
          # A close click must exit directly, without a confirmation window.
          $again = Start-Process $installer -PassThru
          Start-Sleep -Seconds 2
          $again.Refresh()
          $closeHwnd=[MouseTest]::FindButton($again.MainWindowHandle,"Закрыть")
          if($closeHwnd -eq [IntPtr]::Zero){throw 'Close control missing'}
          [MouseTest]::GetWindowRect($closeHwnd,[ref]$rect) | Out-Null
          Click-At ([int](($rect.Left+$rect.Right)/2)) ([int](($rect.Top+$rect.Bottom)/2))
          if(-not $again.WaitForExit(5000)){throw 'Close click did not close installer directly'}


      - name: Upload visual checks
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-visual-checks
          path: browser/artifacts/*.png
          if-no-files-found: ignore

      - name: Upload preview artifacts
        # Preserve the verified binary for diagnosing failed runtime tests.
        # Release publication below still requires every mandatory check.
        if: always() && steps.verified.outputs.passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-Preview-${{ env.PREVIEW_NUMBER }}-x64
          path: |
            browser/artifacts/Soulu-Preview-${{ env.PREVIEW_NUMBER }}-x64.zip
            browser/artifacts/Soulu-Preview-${{ env.PREVIEW_NUMBER }}-x64.exe
            browser/artifacts/engine-version.json
          if-no-files-found: error

      - name: Publish Soulu release
        if: success() && (github.ref == 'refs/tags/preview-37' || (github.ref == 'refs/heads/main' && inputs.publish)) && steps.verified.outputs.passed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ env.PREVIEW_NUMBER }}
          name: Soulu Preview ${{ env.PREVIEW_NUMBER }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: browser/artifacts/release-notes.md
          files: |
            browser/artifacts/Soulu-Preview-${{ env.PREVIEW_NUMBER }}-x64.exe
            browser/artifacts/Soulu-Preview-${{ env.PREVIEW_NUMBER }}-x64.zip
            browser/artifacts/engine-version.json
