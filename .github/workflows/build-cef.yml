name: Build Soulu CEF Preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after a successful build
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "cef/**"
      - "ui/**"
      - "vpn/**"
      - "scripts/cef-installer.nsi"
      - ".github/workflows/build-cef.yml"

permissions:
  contents: write

jobs:
  windows-cef:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PREVIEW_VERSION: 0.9.0-cef-preview.14
    steps:
      - name: Checkout Soulu
        uses: actions/checkout@v4
        with:
          path: browser

      - name: Checkout official CEF project
        uses: actions/checkout@v4
        with:
          repository: chromiumembedded/cef-project
          path: cef-project

      - name: Cache CEF download and build
        uses: actions/cache@v4
        with:
          path: |
            cef-project/third_party/cef
            cef-build
          key: soulu-cef-win64-144-v1

      - name: Add Soulu target and assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force browser/cef/soulu cef-project/examples/soulu
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/ui | Out-Null
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/vpn | Out-Null
          Copy-Item -Recurse -Force browser/ui/* cef-project/examples/soulu/assets/ui/
          Copy-Item -Recurse -Force browser/vpn/* cef-project/examples/soulu/assets/vpn/
          Add-Content cef-project/examples/CMakeLists.txt "`nadd_subdirectory(soulu)`n"

      - name: Use CEF-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CEF Python compatibility package
        shell: pwsh
        run: python -m pip install --disable-pip-version-check six

      - name: Configure CEF
        shell: pwsh
        run: cmake -S cef-project -B cef-build -G "Visual Studio 17 2022" -A x64 -DUSE_SANDBOX=OFF

      - name: Build Soulu
        shell: pwsh
        run: cmake --build cef-build --config Release --target soulu --parallel 2

      - name: Locate output and package ZIP
        id: package
        shell: pwsh
        run: |
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $exe) { throw "Soulu.exe was not produced" }
          $buildDir = $exe.Directory.FullName
          New-Item -ItemType Directory -Force browser/artifacts | Out-Null
          $zip = Join-Path $PWD "browser/artifacts/Soulu-CEF-$env:PREVIEW_VERSION-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zip -Force
          "build_dir=$buildDir" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $buildDir = "${{ steps.package.outputs.build_dir }}"
          $out = Join-Path $PWD "browser/artifacts/Soulu-CEF-Setup-$env:PREVIEW_VERSION-x64.exe"
          Push-Location browser/scripts
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/INPUTCHARSET" "UTF8" "/DBUILD_DIR=$buildDir" "/DOUT_FILE=$out" cef-installer.nsi
          $nsisExitCode = $LASTEXITCODE
          Pop-Location
          if ($nsisExitCode -ne 0) { exit $nsisExitCode }

      - name: Smoke-test visible installer controls with mouse on Windows
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MouseTest {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left, Top, Right, Bottom; }
            public delegate bool EnumProc(IntPtr hwnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X, Y; }
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT point);
            public static string Describe(IntPtr hwnd) {
              var cls = new System.Text.StringBuilder(128);
              var txt = new System.Text.StringBuilder(256);
              GetClassName(hwnd, cls, cls.Capacity);
              GetWindowText(hwnd, txt, txt.Capacity);
              return $"{cls}: {txt} hwnd={hwnd}";
            }
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr parent, EnumProc callback, IntPtr data);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetWindowText(IntPtr hwnd, System.Text.StringBuilder text, int max);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] static extern int GetClassName(IntPtr hwnd, System.Text.StringBuilder text, int max);
            public static IntPtr FindButton(IntPtr parent, string prefix) {
              IntPtr found = IntPtr.Zero;
              EnumChildWindows(parent, delegate(IntPtr hwnd, IntPtr data) {
                var cls = new System.Text.StringBuilder(128);
                var txt = new System.Text.StringBuilder(256);
                GetClassName(hwnd, cls, cls.Capacity);
                GetWindowText(hwnd, txt, txt.Capacity);
                if (cls.ToString().Equals("Static", StringComparison.OrdinalIgnoreCase) &&
                    txt.ToString().StartsWith(prefix, StringComparison.OrdinalIgnoreCase)) {
                  found = hwnd; return false;
                }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          '@

          function Click-At([int]$x, [int]$y) {
            [MouseTest]::SetCursorPos($x, $y) | Out-Null
            Start-Sleep -Milliseconds 150
            [MouseTest]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
            Start-Sleep -Milliseconds 100
            [MouseTest]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          }

          $installer = Join-Path $PWD "browser/artifacts/Soulu-CEF-Setup-$env:PREVIEW_VERSION-x64.exe"
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/Soulu/Soulu.exe"
          if (Test-Path (Split-Path $installedExe)) { Remove-Item (Split-Path $installedExe) -Recurse -Force }

          $process = Start-Process $installer -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and $process.MainWindowHandle -eq 0) {
            Start-Sleep -Milliseconds 250
            $process.Refresh()
          }
          if ($process.MainWindowHandle -eq 0) { throw "Installer window did not open" }

          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          $beforeDrag = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle, [ref]$beforeDrag) | Out-Null
          [MouseTest]::SetCursorPos(($beforeDrag.Left + 130), ($beforeDrag.Top + 25)) | Out-Null
          Start-Sleep -Milliseconds 200
          [MouseTest]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          [MouseTest]::SetCursorPos(($beforeDrag.Left + 220), ($beforeDrag.Top + 80)) | Out-Null
          Start-Sleep -Milliseconds 350
          [MouseTest]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)
          Start-Sleep -Milliseconds 250
          $afterDrag = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($process.MainWindowHandle, [ref]$afterDrag) | Out-Null
          "Drag check: before=$($beforeDrag.Left),$($beforeDrag.Top) after=$($afterDrag.Left),$($afterDrag.Top)"
          if (($afterDrag.Left - $beforeDrag.Left) -lt 40) { throw "Installer window did not move by mouse drag" }
          $deadline = (Get-Date).AddSeconds(30)
          $installHwnd = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline -and $installHwnd -eq [IntPtr]::Zero) {
            Start-Sleep -Milliseconds 250
            $installHwnd = [MouseTest]::FindButton($process.MainWindowHandle, "Установить")
          }
          if ($installHwnd -eq [IntPtr]::Zero) { throw "Native Install button handle was not found" }
          $rect = New-Object MouseTest+RECT
          [MouseTest]::GetWindowRect($installHwnd, [ref]$rect) | Out-Null
          $x = [int](($rect.Left + $rect.Right) / 2)
          $y = [int](($rect.Top + $rect.Bottom) / 2)
          $hit = [MouseTest]::WindowFromPoint([MouseTest+POINT]@{ X=$x; Y=$y })
          "Install control: $([MouseTest]::Describe($installHwnd)); mouse hit: $([MouseTest]::Describe($hit)) at $x,$y"
          Click-At $x $y
          Start-Sleep -Seconds 12
          if (-not (Test-Path $installedExe)) {
            [MouseTest]::SendMessage($installHwnd, 0x0201, [IntPtr]1, [IntPtr]0x00080008) | Out-Null
            [MouseTest]::SendMessage($installHwnd, 0x0202, [IntPtr]0, [IntPtr]0x00080008) | Out-Null
            Start-Sleep -Seconds 12
            if (Test-Path $installedExe) { throw "Physical mouse click missed, direct label messages work" }
          }

          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $installedExe)) {
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $installedExe)) { throw "Mouse click on Install did not start installation" }

          $process.Refresh()
          [MouseTest]::SetForegroundWindow($process.MainWindowHandle) | Out-Null
          # File creation happens before the full 387 MB payload has finished
          # extracting. Wait for the actual finish-page control, not a timer.
          $deadline = (Get-Date).AddMinutes(5)
          $openHwnd = [IntPtr]::Zero
          while ((Get-Date) -lt $deadline -and $openHwnd -eq [IntPtr]::Zero) {
            Start-Sleep -Milliseconds 250
            $openHwnd = [MouseTest]::FindButton($process.MainWindowHandle, "Открыть")
          }
          if ($openHwnd -eq [IntPtr]::Zero) { throw "Native Open button handle was not found" }
          [MouseTest]::GetWindowRect($openHwnd, [ref]$rect) | Out-Null
          Click-At ([int](($rect.Left + $rect.Right) / 2)) ([int](($rect.Top + $rect.Bottom) / 2))

          $deadline = (Get-Date).AddSeconds(45)
          $soulu = $null
          while ((Get-Date) -lt $deadline -and -not $soulu) {
            Start-Sleep -Milliseconds 500
            $soulu = Get-Process Soulu -ErrorAction SilentlyContinue
          }
          if (-not $soulu) { throw "Mouse click on Open did not launch Soulu" }
          $soulu | Stop-Process -Force
          "Physical mouse-click test passed for visible Install and Open controls."

      - name: Test live CEF settings and toolbar on Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check websocket-client
          $env:SOULU_UI_TEST_PORT = "9223"
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/Soulu/Soulu.exe"
          $app = Start-Process $installedExe -PassThru
          try {
            python browser/scripts/test-cef-ui.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload preview artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-CEF-${{ env.PREVIEW_VERSION }}-x64
          path: browser/artifacts/*
          if-no-files-found: error

      - name: Publish CEF prerelease
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PREVIEW_VERSION }}
          name: Soulu CEF Preview ${{ env.PREVIEW_VERSION }}
          prerelease: true
          generate_release_notes: true
          files: browser/artifacts/*
