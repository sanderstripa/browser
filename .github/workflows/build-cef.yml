name: Build Soulu CEF Preview

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after a successful build
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "cef/**"
      - "ui/**"
      - "vpn/**"
      - "scripts/cef-installer.nsi"
      - ".github/workflows/build-cef.yml"

permissions:
  contents: write

jobs:
  windows-cef:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PREVIEW_VERSION: 0.9.0-cef-preview.12
    steps:
      - name: Checkout Soulu
        uses: actions/checkout@v4
        with:
          path: browser

      - name: Checkout official CEF project
        uses: actions/checkout@v4
        with:
          repository: chromiumembedded/cef-project
          path: cef-project

      - name: Cache CEF download and build
        uses: actions/cache@v4
        with:
          path: |
            cef-project/third_party/cef
            cef-build
          key: soulu-cef-win64-144-v1

      - name: Add Soulu target and assets
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force browser/cef/soulu cef-project/examples/soulu
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/ui | Out-Null
          New-Item -ItemType Directory -Force cef-project/examples/soulu/assets/vpn | Out-Null
          Copy-Item -Recurse -Force browser/ui/* cef-project/examples/soulu/assets/ui/
          Copy-Item -Recurse -Force browser/vpn/* cef-project/examples/soulu/assets/vpn/
          Add-Content cef-project/examples/CMakeLists.txt "`nadd_subdirectory(soulu)`n"

      - name: Use CEF-compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CEF Python compatibility package
        shell: pwsh
        run: python -m pip install --disable-pip-version-check six

      - name: Configure CEF
        shell: pwsh
        run: cmake -S cef-project -B cef-build -G "Visual Studio 17 2022" -A x64 -DUSE_SANDBOX=OFF

      - name: Build Soulu
        shell: pwsh
        run: cmake --build cef-build --config Release --target soulu --parallel 2

      - name: Locate output and package ZIP
        id: package
        shell: pwsh
        run: |
          $exe = Get-ChildItem cef-build -Recurse -Filter Soulu.exe | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $exe) { throw "Soulu.exe was not produced" }
          $buildDir = $exe.Directory.FullName
          New-Item -ItemType Directory -Force browser/artifacts | Out-Null
          $zip = Join-Path $PWD "browser/artifacts/Soulu-CEF-$env:PREVIEW_VERSION-x64.zip"
          Compress-Archive -Path "$buildDir/*" -DestinationPath $zip -Force
          "build_dir=$buildDir" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $buildDir = "${{ steps.package.outputs.build_dir }}"
          $out = Join-Path $PWD "browser/artifacts/Soulu-CEF-Setup-$env:PREVIEW_VERSION-x64.exe"
          Push-Location browser/scripts
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/INPUTCHARSET" "UTF8" "/DBUILD_DIR=$buildDir" "/DOUT_FILE=$out" cef-installer.nsi
          $nsisExitCode = $LASTEXITCODE
          Pop-Location
          if ($nsisExitCode -ne 0) { exit $nsisExitCode }

      - name: Smoke-test installer buttons on Windows
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $installer = Join-Path $PWD "browser/artifacts/Soulu-CEF-Setup-$env:PREVIEW_VERSION-x64.exe"
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs/Soulu/Soulu.exe"
          if (Test-Path $installedExe) { Remove-Item (Split-Path $installedExe) -Recurse -Force }

          $installerProcess = Start-Process $installer -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $window = $null
          while ((Get-Date) -lt $deadline -and -not $window) {
            Start-Sleep -Milliseconds 250
            $condition = New-Object Windows.Automation.PropertyCondition(
              [Windows.Automation.AutomationElement]::ProcessIdProperty,
              $installerProcess.Id
            )
            $window = [Windows.Automation.AutomationElement]::RootElement.FindFirst(
              [Windows.Automation.TreeScope]::Children,
              $condition
            )
          }
          if (-not $window) { throw "Installer window did not open" }

          function Find-Button([string]$prefix) {
            $buttons = $window.FindAll(
              [Windows.Automation.TreeScope]::Descendants,
              (New-Object Windows.Automation.PropertyCondition(
                [Windows.Automation.AutomationElement]::ControlTypeProperty,
                [Windows.Automation.ControlType]::Button
              ))
            )
            foreach ($button in $buttons) {
              if ($button.Current.Name -like "$prefix*") { return $button }
            }
            return $null
          }

          $deadline = (Get-Date).AddSeconds(30)
          $installButton = $null
          while ((Get-Date) -lt $deadline -and -not $installButton) {
            Start-Sleep -Milliseconds 500
            $installButton = Find-Button "Установить"
          }
          if (-not $installButton) {
            $allButtons = $window.FindAll(
              [Windows.Automation.TreeScope]::Descendants,
              (New-Object Windows.Automation.PropertyCondition(
                [Windows.Automation.AutomationElement]::ControlTypeProperty,
                [Windows.Automation.ControlType]::Button
              ))
            )
            foreach ($button in $allButtons) { Write-Host "Detected button: [$($button.Current.Name)]" }
            throw "Real Install button was not found after 30 seconds"
          }
          $installButton.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()

          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $installedExe)) {
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $installedExe)) { throw "Installation did not create Soulu.exe" }

          $deadline = (Get-Date).AddSeconds(30)
          $openButton = $null
          while ((Get-Date) -lt $deadline -and -not $openButton) {
            Start-Sleep -Milliseconds 500
            $openButton = Find-Button "Открыть"
          }
          if (-not $openButton) { throw "Real Open button was not found" }
          $openButton.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()

          $deadline = (Get-Date).AddSeconds(45)
          $soulu = $null
          while ((Get-Date) -lt $deadline -and -not $soulu) {
            Start-Sleep -Milliseconds 500
            $soulu = Get-Process Soulu -ErrorAction SilentlyContinue
          }
          if (-not $soulu) { throw "Open button did not launch Soulu" }
          $soulu | Stop-Process -Force
          "Installer UI smoke test passed: Install and Open are real working buttons."

      - name: Upload preview artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-CEF-${{ env.PREVIEW_VERSION }}-x64
          path: browser/artifacts/*
          if-no-files-found: error

      - name: Publish CEF prerelease
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PREVIEW_VERSION }}
          name: Soulu CEF Preview ${{ env.PREVIEW_VERSION }}
          prerelease: true
          generate_release_notes: true
          files: browser/artifacts/*
