name: Dispatch CEF session validation

on:
  push:
    branches:
      - fix-persistent-cef-session
    paths:
      - "cef/**"
      - "scripts/test-cef-session.py"
      - ".github/workflows/build-cef.yml"
      - ".github/workflows/dispatch-cef-session-test.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run Soulu CEF validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-cef.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f publish=false
