name: Publish Soulu Preview 26

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-installer-from-artifact.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout Soulu
        uses: actions/checkout@v4

      - name: Download compiled Soulu auth-persistence artifact
        uses: actions/download-artifact@v4
        with:
          name: Soulu-Preview-25-x64
          path: source-artifact
          github-token: ${{ github.token }}
          repository: sanderstripa/browser
          run-id: 36704502327

      - name: Extract compiled Soulu and prepare Preview 26 ZIP
        shell: pwsh
        run: |
          $sourceZip = Join-Path $PWD "source-artifact/Soulu-Preview-25-x64.zip"
          if (-not (Test-Path $sourceZip)) { throw "Compiled Soulu ZIP was not downloaded" }
          $buildDir = Join-Path $PWD "soulu-build"
          New-Item -ItemType Directory -Force $buildDir | Out-Null
          Expand-Archive -Path $sourceZip -DestinationPath $buildDir -Force
          if (-not (Test-Path (Join-Path $buildDir "Soulu.exe"))) { throw "Soulu.exe is missing from compiled artifact" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $sourceZip (Join-Path $PWD "artifacts/Soulu-Preview-26-x64.zip") -Force

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Soulu Preview 26 installer
        shell: pwsh
        run: |
          $buildDir = Join-Path $PWD "soulu-build"
          $out = Join-Path $PWD "artifacts/Soulu-Preview-26-x64.exe"
          ./installer/build.ps1 -BuildDir $buildDir -OutFile $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $out)) { throw "Installer was not produced" }
          Get-Item $out | Format-List FullName,Length,LastWriteTime

      - name: Smoke-test installed Soulu normal launch
        shell: pwsh
        run: |
          Get-Process Soulu -ErrorAction SilentlyContinue | Stop-Process -Force
          $installDir = Join-Path $env:LOCALAPPDATA "Programs/Soulu"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $payload = Join-Path $PWD "installer/payload.exe"
          if (-not (Test-Path $payload)) { throw "Installer payload was not produced" }
          $install = Start-Process $payload -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer payload failed with exit code $($install.ExitCode)" }
          $installedExe = Join-Path $installDir "Soulu.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed Soulu.exe is missing" }
          Remove-Item Env:SOULU_UI_TEST_PORT -ErrorAction SilentlyContinue
          $app = Start-Process $installedExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "Soulu exited early with code $($app.ExitCode)"
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'Soulu|libcef|chrome_elf' } |
              Select-Object -First 20 TimeCreated, Id, ProviderName, LevelDisplayName, Message |
              Format-List
            throw "Installed Soulu did not remain running"
          }
          Stop-Process -Id $app.Id -Force

      - name: Upload Preview 26 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Soulu-Preview-26-x64
          path: |
            artifacts/Soulu-Preview-26-x64.exe
            artifacts/Soulu-Preview-26-x64.zip
          if-no-files-found: error

      - name: Publish stable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "preview-26"
          $exe = "artifacts/Soulu-Preview-26-x64.exe"
          $zip = "artifacts/Soulu-Preview-26-x64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $zip --clobber
          } else {
            gh release create $tag $exe $zip --target 01a7a3f660d6e6bfbaafd9aac1d1051b8d7beaf7 --title "Soulu Preview 26" --notes "Soulu Preview 26. Обновлён CEF/Chromium до ветки 154. Переработано постоянное хранение профиля CEF и cookies между штатными перезапусками. Добавлены проверки session/persistent cookies, localStorage и IndexedDB после перезапуска. В релиз включены установщик и ZIP-сборка для Windows x64." --latest
          }
