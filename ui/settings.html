<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;"><title>Настройки</title><link rel="icon" href="settings-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="motion.css"></head><body>
<main class="settings-shell" data-view="home" aria-busy="true"><aside class="settings-nav" hidden><nav id="sectionNav" aria-label="Разделы настроек"></nav></aside><header class="settings-header"><h1 id="settingsTitle">Настройки</h1><div class="search-box"><input id="settingsSearch" type="search" placeholder="Поиск в настройках" aria-label="Поиск в настройках" autocomplete="off"><button id="clearSearch" type="button" aria-label="Очистить поиск" hidden>×</button></div><button id="closeSettings" type="button" aria-label="Закрыть настройки">×</button></header><section class="settings-content" id="settingsContent" tabindex="-1" aria-label="Настройки"><div id="homeCards" class="home-cards"></div><div id="searchResults" hidden aria-live="polite"></div><div id="sectionContent" hidden></div></section><footer class="settings-footer"><p id="dataMessage" role="status" aria-live="polite"></p><button class="secondary" id="cancelSettings" type="button" disabled>Отмена</button><button class="primary" id="applySettings" type="button" disabled>Применить</button></footer></main>

<dialog id="actionDialog" aria-labelledby="actionTitle"><header class="dialog-header"><h2 id="actionTitle"></h2><button id="closeAction" type="button" aria-label="Закрыть">×</button></header><div id="actionContent"></div><p id="actionMessage" role="status" aria-live="polite"></p></dialog>
<script src="motion.js"></script><script src="cef-bridge.js"></script><script src="vpn-key.js"></script><script src="settings.js"></script><script src="settings-data.js"></script></body></html>
