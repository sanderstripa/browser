<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="visual.css"><link rel="stylesheet" href="polish.css"><title>VPN</title></head><body><main>
<header><span></span><button id="settingsBtn" class="round" aria-label="Настройки"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h7M15 17h5"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="17" r="2"/></svg></button></header>
<section class="hero"><button id="primaryAction" class="connect" aria-label="Подключить"><span class="power-core"><svg viewBox="0 0 24 24"><path d="M12 2.5v9M5.75 5.75a8.75 8.75 0 1 0 12.5 0"/></svg></span><span id="primaryLabel">Подключить</span></button><section id="status" class="connection disconnected"><span class="pulse"></span><strong id="statusText">Отключено</strong><small id="detail">Прямое подключение</small></section></section>
<section class="card profile-card"><input id="profile" type="hidden"><div class="profile-select"><button id="profileTrigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="profile-main"><img id="profileFlag" class="server-flag" alt=""><span id="profileLabel">Нет профилей</span></span><svg class="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button><div id="profileMenu" role="listbox"></div></div><div class="tools"><button id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Добавить</span></button><button id="edit"><svg viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L19 9l-4-4L4 16Z"/><path d="m13 7 4 4"/></svg><span>Изменить</span></button><button id="remove"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></svg><span>Удалить</span></button></div></section><div id="error" role="alert"></div>
<nav class="quick-actions" aria-label="Быстрые действия"><button id="checkIp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/></svg><span>Проверить IP</span></button><span class="divider"></span><button id="ping"><svg viewBox="0 0 24 24"><path d="M4 14h3l2-6 4 11 2-5h5"/></svg><span>Пинг</span></button></nav></main>
<dialog id="profileDialog"><form method="dialog"><div class="dialog-head"><h2 id="dialogTitle">Новый профиль</h2><button value="cancel" class="close">×</button></div><label>Название</label><input id="name" maxlength="40" placeholder="Amsterdam"><label>Страна</label><div class="country-field"><img id="countryFlag" alt=""><input id="country" maxlength="56" autocomplete="off" placeholder="Нидерланды"></div><p class="hint">Введите страну по-русски или по-английски — флаг появится автоматически.</p><label>VLESS URL</label><textarea id="url" rows="4" spellcheck="false" placeholder="vless://…"></textarea><p class="hint" id="urlHint"></p><div id="modalError"></div><button id="save" value="default" class="primary">Сохранить профиль</button></form></dialog>
<dialog id="settingsDialog"><form method="dialog"><div class="dialog-head"><h2>Настройки</h2><button value="default" class="close">×</button></div>
<section class="settings-card appearance-card"><h3><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.2-2-.8-1 .1-2 1.3-2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><span>Внешний вид</span></h3><input id="theme" type="hidden" value="auto"><div class="theme-options" role="radiogroup" aria-label="Тема оформления"><button type="button" data-theme-value="auto"><span>◐</span>Система</button><button type="button" data-theme-value="light"><span>☀</span>Светлая</button><button type="button" data-theme-value="dark"><span>☾</span>Тёмная</button></div></section>
<section class="settings-card connection-card"><h3><svg viewBox="0 0 24 24"><path d="M9.5 14.5 14.5 9M7 17l-1.5 1.5a3.5 3.5 0 0 1-5-5L5 9a3.5 3.5 0 0 1 5 0M17 7l1.5-1.5a3.5 3.5 0 0 1 5 5L19 15a3.5 3.5 0 0 1-5 0"/></svg><span>Подключение</span></h3><label class="toggle"><span>Подключаться при запуске Internet Browser</span><input type="checkbox" id="autoConnect"></label><label class="toggle"><span>Блокировать WebRTC вне прокси (после перезапуска)</span><input type="checkbox" id="webrtc"></label></section>
<section class="settings-card split-card"><h3><svg viewBox="0 0 24 24"><path d="M6 4v7M18 4v7M12 13v7M6 11h12M12 13v-2"/><circle cx="6" cy="3" r="1.5"/><circle cx="18" cy="3" r="1.5"/><circle cx="12" cy="21" r="1.5"/></svg><span>Раздельное туннелирование</span></h3><label>Режим</label><input id="splitMode" type="hidden" value="all"><div class="setting-select" data-select="splitMode"><button type="button" class="setting-trigger"><span>Все сайты через VPN</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button><div class="setting-menu"><button type="button" data-value="all">Все сайты через VPN</button><button type="button" data-value="bypass">Все, кроме списка</button><button type="button" data-value="only">Только сайты из списка</button></div></div><textarea id="domains" rows="5" placeholder="example.com&#10;bank.example"></textarea><p class="hint">Один домен на строку. Правило включает все его поддомены.</p><div id="settingsError"></div></section>
<button id="update" type="button" class="update-row"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5h12M12 3.5l3 3-3 3M17 13.5H5M8 10.5l-3 3 3 3"/></svg><span><strong>Обновить Xray</strong><small>Доступно после отключения · с возможностью отката</small></span></button></form></dialog><script src="popup.js"></script></body></html>
